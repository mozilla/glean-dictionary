[project]
name = "glean-dictionary"
version = "0.0.0"
description = "Glean Dictionary Python support."
keywords = ["glean-dictionary"]
readme = "README.md"
authors = [
    {name = "Data@Mozilla", email = "fx-data-dev@mozilla.org"},
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11.0"
dependencies = [
  "click==8.1.7",
  "furl==2.1.3",
  "isort==5.13.2",
  "Jinja2==3.1.3",
  "pip-tools==7.4.1",
  "pytest==8.1.1",
  "pytest-isort==4.0.0",
  "pytest-ruff==0.4.1",
  "ruff==0.3.0",
  "requests==2.31.0",
  "stringcase==1.2.0",
  "PyYAML==6.0.1",
  "google-cloud-bigquery==3.25.0",
  "google-cloud-storage==2.16.0",
  "GitPython==3.1.41",
]

[project.urls]
Homepage = "https://github.com/mozilla/glean-dictionary"

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "etl"
module-root = ""

[project.scripts]
gd = "etl.__main__:cli"

[tool.isort]
line_length = 100
default_section = "THIRDPARTY"
known_first_party = "glean-dictionary"
# For compatibility with black:
multi_line_output = 3
include_trailing_comma = "True"
force_grid_wrap = 0
use_parentheses = "True"

[tool.pytest.ini_options]
testpaths = ['etl', 'etl_tests']
addopts = '--ruff --ruff-format'

[tool.ruff]
line-length=100
exclude=[".git","__pycache__","*venv","node_modules"]

[tool.ruff.lint]
# E121,E123,E126,E226,E24,E704,W503,W504: Ignored in default pycodestyle config:
# https://github.com/PyCQA/pycodestyle/blob/2.2.0/pycodestyle.py#L72
# Our additions...
# E129: visually indented line with same indent as next logical line
# E203: pep8 is wrong, overridden by black (https://github.com/psf/black/issues/315)
ignore = ["E203"] # "E129" is not supported by Ruff yet
select = ["E", "F"]
