[build]
command = """
    set -e
    curl -LsSf https://astral.sh/uv/install.sh | sh && export PATH=\"$HOME/.local/bin:$PATH\"
    uv run gd build-metadata
    npm ci
    npm run build
    if [ "$STORYBOOK" ]; then
      npm run build-storybook
      mv storybook-static public/storybook
    fi
"""
environment = { PYTHON_VERSION = "3.11" }
publish = "public"

[context.production]
  [context.production.environment]
  CONTEXT = "production"
  GLEAN_APPLICATION_ID = "glean-dictionary"


[[headers]]
  # Define which paths this specific [[headers]] block will cover.
  for = "/data/*"
    [headers.values]
    Access-Control-Allow-Origin = "*"

[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/:splat"
  status = 200

# MCP server endpoint
[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200

[functions]
directory = ".netlify"
